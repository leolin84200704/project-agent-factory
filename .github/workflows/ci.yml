name: High-Trust Verification Gate

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js (for NestJS DI smoke hook tests)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run declarative verification contract (paf verify)
        run: python3 bin/paf verify --repo . --mode ci
